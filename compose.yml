services:
  backend:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      TACTIQ_AUTH_ENABLED: ${TACTIQ_AUTH_ENABLED:-false}
      TACTIQ_API_TOKENS_JSON: ${TACTIQ_API_TOKENS_JSON:-}
      TACTIQ_CORS_ALLOW_ORIGINS: ${TACTIQ_CORS_ALLOW_ORIGINS:-}
      TACTIQ_CV_MODEL_PATH: /models/detector.onnx
      TACTIQ_CV_MODEL_FORMAT: ${TACTIQ_CV_MODEL_FORMAT:-yolox}
      TACTIQ_CV_MODEL_SHA256: ${TACTIQ_CV_MODEL_SHA256:-}
      TACTIQ_CV_INPUT_SIZE: ${TACTIQ_CV_INPUT_SIZE:-416}
      TACTIQ_VALUE_MODEL_PATH: ${TACTIQ_VALUE_MODEL_PATH:-}
      FOUNDRY_ENABLED: ${FOUNDRY_ENABLED:-false}
      AZURE_FOUNDRY_PROJECT_ENDPOINT: ${AZURE_FOUNDRY_PROJECT_ENDPOINT:-}
      AZURE_FOUNDRY_PROJECT_DEPLOYMENT_NAME: ${AZURE_FOUNDRY_PROJECT_DEPLOYMENT_NAME:-}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:-}
      FOUNDRY_COMMENTARY_USE_DIRECT_AGENTS: ${FOUNDRY_COMMENTARY_USE_DIRECT_AGENTS:-false}
      FOUNDRY_COMMENTARY_PLAYBYPLAY_AGENT_NAME: ${FOUNDRY_COMMENTARY_PLAYBYPLAY_AGENT_NAME:-}
      FOUNDRY_COMMENTARY_COLOR_AGENT_NAME: ${FOUNDRY_COMMENTARY_COLOR_AGENT_NAME:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_API_KEY: ${AZURE_SPEECH_API_KEY:-}
      AZURE_SPEECH_DEFAULT_VOICE: ${AZURE_SPEECH_DEFAULT_VOICE:-}
      AZURE_SPEECH_DEFAULT_VOICE_BY_LANGUAGE_JSON: ${AZURE_SPEECH_DEFAULT_VOICE_BY_LANGUAGE_JSON:-}
      AZURE_SPEECH_DEFAULT_COMMENTATOR_A_VOICE: ${AZURE_SPEECH_DEFAULT_COMMENTATOR_A_VOICE:-}
      AZURE_SPEECH_DEFAULT_COMMENTATOR_B_VOICE: ${AZURE_SPEECH_DEFAULT_COMMENTATOR_B_VOICE:-}
      AZURE_SPEECH_DEFAULT_COMMENTATOR_PAIR_BY_LANGUAGE_JSON: ${AZURE_SPEECH_DEFAULT_COMMENTATOR_PAIR_BY_LANGUAGE_JSON:-}
    volumes:
      - tactiq-data:/data
      - ${TACTIQ_MODEL_DIRECTORY:-./models}:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: apps/web
      args:
        TACTIQ_BACKEND_URL: http://backend:8080
    ports:
      - "${TACTIQ_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tactiq-data:
